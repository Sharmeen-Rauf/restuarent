<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kababjees Fried Chicken | Fast, Fresh, and Flavorful!</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <!-- Logo -->
            <a href="/" class="logo">
                <img src="https://via.placeholder.com/150x50/FF6B00/FFFFFF?text=Kababjees" alt="Kababjees Fried Chicken">
            </a>

            <!-- Header Actions -->
            <div class="header-actions">
                <!-- Location Selector -->
                <button class="location-btn" id="locationBtn">
                    <i class="fas fa-map-marker-alt"></i>
                    <div class="location-text">
                        <span>Change Location</span>
                        <span class="location-name" id="currentLocation">Karachi</span>
                    </div>
                </button>

                <!-- Contact -->
                <a href="tel:021-111-666-111" class="contact-link">
                    <i class="fas fa-phone"></i>
                    <div class="contact-text">
                        <span>Contact us</span>
                        <span>021-111-666-111</span>
                    </div>
                </a>

                <!-- Complaint Link -->
                <a href="https://feedback.kababjeesgroup.com/" class="complaint-link" target="_blank">
                    <i class="fas fa-comment-alt"></i>
                    <div class="complaint-text">
                        <span>Submit Your Complaint</span>
                        <span>From Complaint to Care – Share With Us</span>
                    </div>
                </a>

                <!-- Cart -->
                <button class="cart-btn" id="cartBtn">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </button>

                <!-- Location Icon -->
                <button class="location-icon-btn" id="locationIconBtn">
                    <i class="fas fa-map-marker-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Banner Section -->
        <section class="banner-section">
            <div class="banner-container">
                <div class="banner-image">
                    <img src="https://via.placeholder.com/1200x400/FF6B00/FFFFFF?text=Delicious+Fried+Chicken" alt="Banner">
                </div>
                <div class="payment-badge">
                    <img src="https://via.placeholder.com/200x50/4CAF50/FFFFFF?text=Card+Payment+Available" alt="Payment Available">
                </div>
            </div>
        </section>

        <!-- Menu Categories -->
        <section class="menu-section">
            <div class="container">
                <h2 class="section-title">Menu</h2>
                
                <!-- Category Tabs -->
                <div class="category-tabs" id="categoryTabs">
                    <button class="category-tab active" data-category="all">All</button>
                    <button class="category-tab" data-category="chicken">Fried Chicken</button>
                    <button class="category-tab" data-category="burgers">Burgers</button>
                    <button class="category-tab" data-category="wraps">Wraps</button>
                    <button class="category-tab" data-category="rice">Rice</button>
                    <button class="category-tab" data-category="deals">Deals</button>
                </div>

                <!-- Menu Items Grid -->
                <div class="menu-grid" id="menuGrid">
                    <!-- Menu items will be generated by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <!-- Location Modal -->
    <div class="modal" id="locationModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Select your order type</h2>
            </div>
            
            <!-- Order Type Selection -->
            <div class="order-type-selection">
                <button class="order-type-btn active" data-type="delivery">Delivery</button>
                <button class="order-type-btn" data-type="pickup">Pick-Up</button>
            </div>

            <div class="modal-header">
                <h2>Please select your location</h2>
            </div>

            <!-- Use Current Location Button -->
            <button class="current-location-btn" id="currentLocationBtn">
                <i class="fas fa-crosshairs"></i>
                <span>Use Current Location</span>
            </button>

            <!-- Cities Grid -->
            <div class="cities-grid">
                <button class="city-card" data-city="karachi">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=KHI" alt="Karachi">
                    <span>Karachi</span>
                </button>
                <button class="city-card" data-city="hyderabad">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=HYD" alt="Hyderabad">
                    <span>Hyderabad</span>
                </button>
                <button class="city-card" data-city="lahore">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=LHR" alt="Lahore">
                    <span>Lahore</span>
                </button>
                <button class="city-card" data-city="islamabad">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=ISB" alt="Islamabad">
                    <span>Islamabad</span>
                </button>
                <button class="city-card" data-city="multan">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=MLT" alt="Multan">
                    <span>Multan</span>
                </button>
                <button class="city-card" data-city="sialkot">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=SKT" alt="Sialkot">
                    <span>Sialkot</span>
                </button>
                <button class="city-card" data-city="faisalabad">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=FSD" alt="Faisalabad">
                    <span>Faisalabad</span>
                </button>
                <button class="city-card" data-city="rahimyarkhan">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=RYK" alt="Rahim Yar Khan">
                    <span>Rahim Yar Khan</span>
                </button>
                <button class="city-card" data-city="bahawalpur">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=BWP" alt="Bahawalpur">
                    <span>Bahawalpur</span>
                </button>
                <button class="city-card" data-city="larkana">
                    <img src="https://via.placeholder.com/80x80/FF6B00/FFFFFF?text=LRK" alt="Larkana">
                    <span>Larkana</span>
                </button>
            </div>

            <!-- Search Location -->
            <div class="location-search">
                <input type="text" placeholder="Please select your location" id="locationSearch">
                <i class="fas fa-search"></i>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer">
                <button class="select-btn" id="selectLocationBtn" disabled>Select</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
